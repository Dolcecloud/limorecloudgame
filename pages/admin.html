<!-- Trang Admin Dashboard -->
<style>
    .admin-screen {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding-bottom: 22px;
    }
    .admin-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
    }
    .admin-header h2 {
        margin: 0;
        font-size: 22px;
        color: #f8fafc;
    }
    .admin-header p {
        margin: 6px 0 0;
        color: #cbd5e1;
        font-size: 13px;
    }
    .admin-badge {
        background: rgba(250,204,21,0.14);
        color: #facc15;
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 12px;
        font-weight: 700;
    }
    .admin-button {
        border: none;
        border-radius: 18px;
        padding: 10px 14px;
        font-size: 12px;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
    }
    .admin-grid {
        display: grid;
        gap: 12px;
    }
    .admin-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 16px;
    }
    .admin-card h3 {
        margin: 0 0 12px;
        color: #f8fafc;
        font-size: 16px;
    }
    .admin-card small {
        color: #94a3b8;
        font-size: 12px;
        display: block;
        margin-bottom: 10px;
    }
    .admin-card strong {
        display: block;
        font-size: 24px;
        font-weight: 700;
        color: #f8fafc;
    }
    .admin-card-row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .admin-card-row-three {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .admin-control-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
    }
    .admin-control-row input {
        flex: 1;
        min-width: 0;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 12px 14px;
        color: #f1f5f9;
        font-size: 13px;
        outline: none;
    }
    .admin-control-row button {
        flex-shrink: 0;
        border: none;
        background: #2563eb;
        color: #fff;
        border-radius: 16px;
        padding: 12px 14px;
        cursor: pointer;
        font-size: 13px;
    }
    .admin-user-list {
        display: grid;
        gap: 10px;
    }
    .admin-user-item {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 14px;
        display: grid;
        gap: 12px;
    }
    .admin-user-top {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        flex-wrap: wrap;
    }
    .admin-user-top div {
        min-width: 0;
    }
    .admin-user-top .user-name {
        font-size: 14px;
        font-weight: 800;
        color: #f1f5f9;
    }
    .admin-user-top .user-email,
    .admin-user-top .user-meta {
        font-size: 11px;
        color: #94a3b8;
        word-break: break-all;
    }
    .admin-user-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }
    .admin-user-actions button {
        border: none;
        border-radius: 14px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
    }
    .admin-user-actions .delete-btn {
        background: #ef4444;
        color: #fff;
    }
    .admin-user-actions .disabled-btn {
        background: rgba(255,255,255,0.1);
        color: #94a3b8;
    }
    @media(max-width: 880px) {
        .admin-card-row-three,
        .admin-card-row {
            grid-template-columns: 1fr;
        }
    }
</style>
<div class="admin-screen">
    <div class="admin-header">
        <div>
            <h2>Admin Dashboard</h2>
            <p>Giao diện quản lý riêng cho admin.</p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
            <span class="admin-badge">Admin</span>
            <button class="admin-button" onclick="switchPage('profile')">Quay lại Me</button>
        </div>
    </div>

    <div class="admin-grid admin-card-row-three">
        <div class="admin-card">
            <small>Tổng tài khoản</small>
            <strong id="admin-total-users">0</strong>
        </div>
        <div class="admin-card">
            <small>Tổng admin</small>
            <strong id="admin-total-admins">0</strong>
        </div>
        <div class="admin-card">
            <small>Bảo trì hệ thống</small>
            <div class="admin-control-row" style="justify-content: space-between; gap:12px;">
                <strong id="admin-maintenance-status" style="color:#facc15; font-size:16px;">OFF</strong>
                <button class="admin-button" id="maintenance-toggle" onclick="toggleMaintenanceMode()">Bật/Tắt</button>
            </div>
        </div>
    </div>

    <div class="admin-grid admin-card-row">
        <div class="admin-card">
            <h3>Truy cập hiện tại</h3>
            <div id="admin-current-visitor" style="display:grid; gap:10px; color:#cbd5e1; font-size:13px;">
                <div>IP: <span id="current-visitor-ip">Chưa có</span></div>
                <div>Quốc gia: <span id="current-visitor-country">Chưa có</span></div>
                <div>Thiết bị: <span id="current-visitor-device">Chưa có</span></div>
                <div>Thời gian: <span id="current-visitor-time">Chưa có</span></div>
            </div>
        </div>
        <div class="admin-card">
            <h3>Thống kê truy cập</h3>
            <div style="display:grid; gap:10px; color:#cbd5e1; font-size:13px;">
                <div>Tổng lượt vào app: <span id="admin-total-visits">0</span></div>
                <div>Người dùng hiện tại: <span id="admin-current-users">0</span></div>
            </div>
        </div>
    </div>

    <div class="admin-control-row">
        <input id="admin-search" type="text" placeholder="Tìm tài khoản theo email hoặc tên">
        <button onclick="initAdminPage()">Làm mới</button>
    </div>

    <div class="admin-card">
        <h3>Danh sách tài khoản</h3>
        <div id="admin-user-list" class="admin-user-list"></div>
    </div>
</div>
