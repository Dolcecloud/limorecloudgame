<!-- Container chính của trang Cloud Play -->
<div style="display: flex; flex-direction: column; gap: 16px; padding-bottom: 20px;">

    <!-- 右上角说明按钮 -->
    <div style="display: flex; justify-content: flex-end;">
        <span style="background: rgba(16, 22, 34, 0.92); border: 1px solid rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 12px; font-size: 10px; color: #94a3b8; cursor: pointer;">
            说明
        </span>
    </div>

    <!-- 连接电脑标题 -->
    <div style="font-size: 13px; font-weight: 600; color: #f1f5f9; line-height: 1.4; text-align: center;">
        连接你的电脑或好友电脑<br>或使用 Limore 云电脑 桌面模式。
    </div>

    <!-- 输入电脑ID 和 连接按钮 -->
    <div style="display: flex; align-items: center; gap: 8px; background: rgba(12, 18, 32, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 6px 6px 6px 14px; backdrop-filter: blur(10px);">
        <input type="text" placeholder="请输入电脑ID进行连接" style="background: transparent; border: none; color: #fff; outline: none; font-size: 11px; width: 100%;">
        <button style="background: linear-gradient(135deg, #facc15, #eab308); border: none; border-radius: 20px; padding: 8px 16px; color: #1e1b4b; font-weight: 700; font-size: 11px; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 12px rgba(250, 204, 21, 0.3);">
            连接
        </button>
    </div>

    <!-- 列表标题 & 刷新按钮 -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <span style="font-size: 14px; font-weight: bold; color: #fff;">列表</span>
        <span style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 5px; cursor: pointer;">
            <i class="fa-solid fa-rotate-right"></i> 刷新
        </span>
    </div>

    <!-- Limore 云电脑横幅 -->
    <div style="background: linear-gradient(135deg, rgba(30, 41, 59, 0.86), rgba(15, 23, 42, 0.96)); border: 1px solid rgba(250, 204, 21, 0.25); border-radius: 16px; padding: 18px; position: relative; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,0.45); min-height: 92px;">
        <!-- Ảnh nền game mờ phía sau banner -->
        <div style="position: absolute; inset: 0; opacity: 0.22; background: url('https://cdn.cloudflare.steamstatic.com/steam/apps/2381590/header.jpg') center/cover; filter: blur(2px);"></div>
        
        <div style="position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="background: #facc15; width: 44px; height: 44px; border-radius: 14px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 14px rgba(250,204,21,0.45);">
                    <i class="fa-solid fa-gamepad" style="color: #1e1b4b; font-size: 18px;"></i>
                </div>
                <div>
                    <h4 style="color: #facc15; font-size: 15px; font-weight: bold; margin-bottom: 4px;">Limore Cloud PC</h4>
                    <p style="color: #cbd5e1; font-size: 11px; line-height: 1.3;">高配游戏PC<br>畅玩1000+游戏</p>
                </div>
            </div>
                <button onclick="switchPage('area')" style="background: linear-gradient(135deg, #facc15, #eab308); border: none; border-radius: 18px; padding: 10px 20px; color: #1e1b4b; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 5px 14px rgba(250, 204, 21, 0.35);">
                进入
            </button>
        </div>
    </div>

    <!-- 在Android上畅玩电脑游戏 -->
    <div style="text-align: center; margin-top: 6px;">
        <h3 style="color: #facc15; font-size: 13px; font-weight: bold; margin-bottom: 4px;">在Android上畅玩电脑游戏</h3>
        <p style="color: #94a3b8; font-size: 10px; line-height: 1.3;">将游戏画面串流至Android手机，随时随地免费玩电脑游戏。</p>
    </div>

    <!-- Các bước hướng dẫn (STEP 1, 2, 3) -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <!-- STEP 1 -->
        <div style="background: rgba(16, 22, 36, 0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px;">
            <div style="font-style: italic; font-weight: bold; color: #facc15; font-size: 11px; margin-bottom: 4px;">STEP.1</div>
            <p style="color: #cbd5e1; font-size: 10px; line-height: 1.3; margin-bottom: 8px;">在目标电脑上安装并登录Windows客户端。</p>
            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.45); border-radius: 6px; padding: 6px 10px;">
                <span style="color: #94a3b8; font-size: 10px;">Windows客户端下载地址</span>
                <span style="background: #facc15; color: #1e1b4b; font-weight: bold; font-size: 9px; padding: 3px 10px; border-radius: 6px; cursor: pointer;">复制</span>
            </div>
        </div>

        <!-- STEP 2 -->
        <div style="background: rgba(16, 22, 36, 0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px;">
            <div style="font-style: italic; font-weight: bold; color: #facc15; font-size: 11px; margin-bottom: 4px;">STEP.2</div>
            <p style="color: #cbd5e1; font-size: 10px; line-height: 1.3;">刷新电脑列表查找电脑，或使用电脑ID进行连接。</p>
        </div>

        <!-- STEP 3 -->
        <div style="background: rgba(16, 22, 36, 0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px;">
            <div style="font-style: italic; font-weight: bold; color: #facc15; font-size: 11px; margin-bottom: 4px;">STEP.3</div>
            <p style="color: #cbd5e1; font-size: 10px; line-height: 1.3;">在电脑上启动游戏，使用外设或云端虚拟按键进行操作。</p>
        </div>
    </div>

</div>
