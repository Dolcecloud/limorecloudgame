<div class="area-page">
    
    <!-- 头部：返回按钮 & 区域标题 -->
    <div class="area-topbar">
        <i class="fa-solid fa-chevron-left back-btn" onclick="switchPage('cloud')"></i>
        <h3 class="area-title">区域</h3>
    </div>

    <div class="area-section">
        <p class="area-section-label">体验服务器</p>
        <div class="area-card selected" id="pkg-1" onclick="selectPackage(1, '99.000đ / 9 ngày', '云端电脑 1')">
            <div class="area-card-header">
                <div class="area-card-title-row">
                    <span class="area-badge yellow">最低延迟</span>
                    <i class="fa-brands fa-windows area-card-icon"></i>
                </div>
                <div class="area-price-row">
                    <span class="area-ms">49ms</span>
                    <span class="area-card-price">99.000đ</span>
                </div>
            </div>
            <div class="area-card-body">
                <div>
                    <p class="area-card-title">云端电脑 1</p>
                    <p class="area-card-subtitle">无需等待</p>
                    <p class="area-card-note">配置：RTX 4060 · 8 GB RAM</p>
                </div>
                <div class="area-check active" id="check-1">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
        </div>

        <p class="area-section-label">支付服务器</p>
        <div class="area-card" id="pkg-2" onclick="selectPackage(2, '470.000đ (Gốc: 1.200.000đ)', '云端电脑 2')">
            <div class="area-card-header">
                <div class="area-card-title-row">
                    <span class="area-badge yellow">最低延迟</span>
                    <i class="fa-brands fa-windows area-card-icon"></i>
                </div>
                <div class="area-price-row">
                    <span class="area-ms">49ms</span>
                    <span class="area-card-price">470.000đ</span>
                </div>
            </div>
            <div class="area-card-body">
                <div>
                    <p class="area-card-title">云端电脑 2</p>
                    <p class="area-card-subtitle">无需等待</p>
                    <p class="area-card-note">配置：RTX 4070 · 16 GB RAM · 高级套餐</p>
                </div>
                <div class="area-check" id="check-2">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
        </div>

    </div>

    <div class="area-bottom">
        <span class="area-summary-text" id="price-display">东南亚-2 : <strong>120 币/小时</strong></span>
        <div class="area-wallet-pill">
            <div class="area-wallet-info">
                <span class="area-wallet-label">支付币</span>
                <span class="area-wallet-value">剩余：0 币</span>
            </div>
        </div>
        <button type="button" class="area-primary-btn" onclick="openQRModal()">立即体验</button>
    </div>

</div>
