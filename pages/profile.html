<!-- Container chính của trang Profile (Me) -->
<div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px;">
    
    <!-- 个人信息 (头像, 名称, ID) -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 2px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div id="profile-avatar" style="width: 48px; height: 48px; background: #6366f1; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);">
                G
            </div>
            <div>
                <h3 id="profile-username" style="color: #f1f5f9; font-size: 15px; font-weight: bold; margin-bottom: 2px;">Khách</h3>
                <span id="profile-userid" style="color: #94a3b8; font-size: 11px;">ID:00000</span>
            </div>
        </div>
        <button onclick="logoutCurrentUser()" style="background: rgba(16, 22, 34, 0.88); color: #f1f5f9; border: none; border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.16);">Đăng xuất</button>
    </div>

    <!-- 邀请好友免费领取VIP -->
        <div class="profile-row profile-invite-row" onclick="" role="button">
            <div class="left">
                <i class="fa-solid fa-gift icon"></i>
                <span class="label">Mời bạn bè nhận VIP miễn phí</span>
            </div>
            <div class="right"></div>
        </div>

    <!-- Tháº» Cloud VIP Banner VÃ ng -->
    <div style="background: linear-gradient(135deg, #facc15, #eab308); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 16px rgba(250, 204, 21, 0.25);">
        <div>
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 3px;">
                <i class="fa-solid fa-cloud" style="color: #1e1b4b; font-size: 13px;"></i>
                <span style="color: #1e1b4b; font-weight: 900; font-size: 13px; font-style: italic; letter-spacing: 0.5px;">Cloud VIP</span>
            </div>
            <p style="color: #334155; font-size: 10px; font-weight: 500; line-height: 1.2;">连接电脑，随时随地玩游戏</p>
        </div>
        <button style="background: #27272a; color: #facc15; border: none; border-radius: 16px; padding: 6px 14px; font-weight: bold; font-size: 10px; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
            Đăng ký
        </button>
    </div>

    <!-- Danh sÃ¡ch cÃ¡c tÃ¹y chá»n Menu -->
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
        
        <!-- 邀请码 -->
            <div class="profile-row" role="button">
                <div class="left">
                    <i class="fa-solid fa-folder-open icon"></i>
                    <span class="label">Mã mời</span>
                </div>
                <div class="right"></div>
            </div>

        <!-- 反馈 -->
        <div class="profile-row" role="button">
            <div class="left">
                <i class="fa-solid fa-message icon"></i>
                <span class="label">Phản hồi</span>
            </div>
            <div class="right"></div>
        </div>

        <!-- 设置 -->
        <div id="profile-settings-row" class="profile-row" role="button">
            <div class="left">
                <i class="fa-solid fa-hexagon-nodes icon"></i>
                <span id="profile-settings-label" class="label">Cài đặt</span>
            </div>
            <div class="right"></div>
        </div>

        <!-- 语言 -->
        <div id="profile-language-row" class="profile-row" onclick="toggleLanguage()" role="button">
            <div class="left">
                <i class="fa-solid fa-language icon"></i>
                <span id="profile-language-label" class="label">Dịch sang tiếng Việt</span>
            </div>
            <div class="right"></div>
        </div>

        <!-- 关于我们 -->
        <div class="profile-row" role="button">
            <div class="left">
                <i class="fa-solid fa-face-smile icon"></i>
                <span class="label">Về chúng tôi</span>
            </div>
            <div class="right"></div>
        </div>

    </div>

</div>
