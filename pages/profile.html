<!-- Container chính của trang Profile (Me) -->
<div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px;">
    
    <!-- Thông tin cá nhân (Avatar, Tên, ID) -->
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 2px;">
        <div id="profile-avatar" style="width: 48px; height: 48px; background: #6366f1; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #fff; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);">
            G
        </div>
        <div>
            <h3 id="profile-username" style="color: #f1f5f9; font-size: 15px; font-weight: bold; margin-bottom: 2px;">Guest</h3>
            <span id="profile-userid" style="color: #94a3b8; font-size: 11px;">ID:00000</span>
        </div>
    </div>

    <!-- Banner mời bạn bè nhận VIP miễn phí -->
    <div style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
        <span style="color: #cbd5e1; font-size: 11px; font-weight: 500;">Invite new users to winfree VIP</span>
        <span style="color: #facc15; font-size: 12px; font-weight: bold; letter-spacing: 2px;">&gt;&gt;&gt;</span>
    </div>

    <!-- Thẻ Cloud VIP Banner Vàng -->
    <div style="background: linear-gradient(135deg, #facc15, #eab308); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 6px 16px rgba(250, 204, 21, 0.25);">
        <div>
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 3px;">
                <i class="fa-solid fa-cloud" style="color: #1e1b4b; font-size: 13px;"></i>
                <span style="color: #1e1b4b; font-weight: 900; font-size: 13px; font-style: italic; letter-spacing: 0.5px;">Cloud VIP</span>
            </div>
            <p style="color: #334155; font-size: 10px; font-weight: 500; line-height: 1.2;">Connect computer to play games in anywhere</p>
        </div>
        <button style="background: #27272a; color: #facc15; border: none; border-radius: 16px; padding: 6px 14px; font-weight: bold; font-size: 10px; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
            SUBSCRIBE
        </button>
    </div>

    <!-- Danh sách các tùy chọn Menu -->
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
        
        <!-- Invitation code -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-folder-open" style="color: #facc15; font-size: 14px; width: 16px; text-align: center;"></i>
                <span style="color: #e2e8f0; font-size: 12px; font-weight: 500;">Invitation code</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #64748b; font-size: 11px;"></i>
        </div>

        <!-- Feedback -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-message" style="color: #facc15; font-size: 14px; width: 16px; text-align: center;"></i>
                <span style="color: #e2e8f0; font-size: 12px; font-weight: 500;">Feedback</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #64748b; font-size: 11px;"></i>
        </div>

        <!-- Setting -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-hexagon-nodes" style="color: #facc15; font-size: 14px; width: 16px; text-align: center;"></i>
                <span style="color: #e2e8f0; font-size: 12px; font-weight: 500;">Setting</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #64748b; font-size: 11px;"></i>
        </div>

        <!-- About us -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-face-smile" style="color: #facc15; font-size: 14px; width: 16px; text-align: center;"></i>
                <span style="color: #e2e8f0; font-size: 12px; font-weight: 500;">About us</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="color: #64748b; font-size: 11px;"></i>
        </div>

    </div>

</div>
