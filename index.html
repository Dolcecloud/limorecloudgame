<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Gaming Mobile</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090b14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png">
    <link rel="icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" type="image/png">
    <link rel="icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" sizes="192x192" type="image/png">
    <link rel="shortcut icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    * { box-sizing: border-box; }
    body {
        background: radial-gradient(circle at 16% 16%, rgba(91, 124, 240, 0.12), transparent 18%),
                    radial-gradient(circle at 82% 10%, rgba(88, 113, 229, 0.08), transparent 14%),
                    linear-gradient(180deg, #03050b 0%, #060811 40%, #090e16 100%);
        color: #eef2ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        overflow: hidden;
        overflow-x: hidden;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    /* Khung điện thoại giả lập */
    .phone-frame {
        width: min(680px, calc(100vw - 16px));
        max-width: 680px;
        min-width: 0;
        height: min(1080px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 16px));
        min-height: 0;
        max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        background: rgba(10, 14, 24, 0.96);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 40px;
        backdrop-filter: blur(18px);
        background-image: linear-gradient(180deg, rgba(12, 16, 30, 0.95), rgba(8, 12, 20, 0.92));
    }

    /* Vùng nội dung cuộn bên trên */
    #main-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 96px;
        background: linear-gradient(180deg, rgba(8, 12, 24, 0.92), rgba(10, 14, 25, 0.95));
        border-radius: 0 0 32px 32px;
    }

    /* Thanh menu điều hướng dưới cùng */
    .bottom-nav {
        width: 100%;
        min-width: 0;
        height: 65px;
        background: rgba(16, 19, 30, 0.95); /* Màu nền menu khớp tone mờ */
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(12px);
        padding: 0 8px 5px;
        flex-shrink: 0;
        gap: 4px;
        box-sizing: border-box;
    }

    .bottom-nav.hidden {
        display: none !important;
    }

    .hidden {
        display: none !important;
    }

    .nav-item {
        cursor: pointer;
        text-align: center;
        color: #94a3b8;
        transition: 0.2s;
        flex: 1 1 0;
        min-width: 0;
        padding: 6px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        overflow: hidden;
    }

    .nav-item div {
        font-size: 11px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .nav-item.active {
        color: #facc15;
    }

    /* Khi xem trên điện thoại thật */
    @media (max-width: 480px) {
        body {
            background: #13141c;
            overflow-x: hidden;
        }
        .phone-frame {
            width: 100vw;
            height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            max-width: 100vw;
            max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            min-width: 0;
            min-height: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .bottom-nav {
            padding: 0 4px 5px;
        }

        .nav-item {
            padding: 6px 2px;
        }

        .nav-item div {
            font-size: 10px;
        }
    }
</style>
</head>
<body>

    <!-- Khung hình điện thoại -->
    <div class="phone-frame">
        
        <!-- Vùng hiển thị nội dung các trang -->
        <div id="main-content"></div>

        <!-- Thanh menu dưới cùng -->
        <div class="bottom-nav hidden">
            <div onclick="switchPage('home')" class="nav-item active" id="nav-home">
                <i class="fa-solid fa-house"></i>
                <div>首页</div>
            </div>
            <div onclick="switchPage('games')" class="nav-item" id="nav-games">
                <i class="fa-solid fa-gamepad"></i>
                <div>游戏库</div>
            </div>
            <div onclick="switchPage('cloud')" class="nav-item" id="nav-cloud">
                <i class="fa-solid fa-desktop"></i>
                <div>电脑</div>
            </div>
            <div onclick="switchPage('profile')" class="nav-item" id="nav-profile">
                <i class="fa-solid fa-user"></i>
                <div>我的</div>
            </div>
        </div>

    </div>

    <!-- Nhúng file logic -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
