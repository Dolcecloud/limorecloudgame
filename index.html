<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Gaming Mobile</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090b14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png">
    <link rel="icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" type="image/png">
    <link rel="icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" sizes="192x192" type="image/png">
    <link rel="shortcut icon" href="https://i.ibb.co/wZK1GL96/Screenshot-2026-07-30-125948.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    * { box-sizing: border-box; }
    body {
        background: #05070f;
        color: #eef2ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        overflow: hidden;
        overflow-x: hidden;
    }

    /* Khung điện thoại giả lập */
    .phone-frame {
        width: min(960px, calc(100vw - 32px));
        max-width: 960px;
        min-width: 0;
        height: min(1260px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 32px));
        min-height: 0;
        max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        background: rgba(10, 14, 24, 0.96);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 40px;
        backdrop-filter: blur(18px);
        background-image: linear-gradient(180deg, rgba(12, 16, 30, 0.95), rgba(8, 12, 20, 0.92));
    }

    /* Vùng nội dung cuộn bên trên */
    #main-content {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 96px;
        background: linear-gradient(180deg, rgba(8, 12, 24, 0.92), rgba(10, 14, 25, 0.95));
        border-radius: 0 0 32px 32px;
    }

    /* Thanh menu điều hướng dưới cùng */
    .bottom-nav {
        width: 100%;
        min-width: 0;
        height: 65px;
        background: rgba(16, 19, 30, 0.95); /* Màu nền menu khớp tone mờ */
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(12px);
        padding: 0 8px 5px;
        flex-shrink: 0;
        gap: 4px;
        box-sizing: border-box;
    }

    .bottom-nav.hidden {
        display: none !important;
    }

    .hidden {
        display: none !important;
    }

    .nav-item {
        cursor: pointer;
        text-align: center;
        color: #94a3b8;
        transition: 0.2s;
        flex: 1 1 0;
        min-width: 0;
        padding: 6px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        overflow: hidden;
    }

    .nav-item div {
        font-size: 11px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .nav-item.active {
        color: #facc15;
    }

    /* Khi xem trên điện thoại thật */
    @media (max-width: 480px) {
        body {
            background: #13141c;
            overflow-x: hidden;
        }
        .phone-frame {
            width: 100vw;
            height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            max-width: 100vw;
            max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            min-width: 0;
            min-height: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .bottom-nav {
            padding: 0 4px 5px;
        }

        .nav-item {
            padding: 6px 2px;
        }

        .nav-item div {
            font-size: 10px;
        }
    }

    /* Tablet / iPad style */
    @media (min-width: 481px) and (max-width: 1024px) {
        .phone-frame {
            width: min(980px, calc(100vw - 40px));
            max-width: 980px;
            height: min(1220px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px));
            max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 40px);
            border-radius: 42px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 42px 120px rgba(0,0,0,0.35);
        }

        .bottom-nav {
            height: 72px;
        }

        .nav-item div {
            font-size: 11px;
        }
    }

    @media (min-width: 1025px) {
        .phone-frame {
            width: calc(100vw - 32px);
            max-width: 1240px;
            height: min(1400px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 32px));
        }
    }

    /* Tablet / large tablet frame */
    body.tablet .phone-frame,
    body.ipad .phone-frame {
        width: min(1220px, calc(100vw - 24px));
        max-width: 1220px;
        height: min(1380px, calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 24px));
        max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 24px);
        border-radius: 56px;
        border: 1px solid rgba(255,255,255,0.12);
        background-image: linear-gradient(180deg, rgba(12, 18, 36, 0.96), rgba(8, 12, 22, 0.96));
        box-shadow: 0 54px 150px rgba(0,0,0,0.35);
    }

    /* iOS-specific frame */
    body.ios .phone-frame {
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: 0 48px 140px rgba(35, 45, 75, 0.45);
        background-image: linear-gradient(180deg, rgba(14, 18, 32, 0.97), rgba(10, 14, 22, 0.98));
    }

    /* Android-specific frame */
    body.android .phone-frame {
        border: 1px dashed rgba(255,255,255,0.12);
        box-shadow: 0 38px 110px rgba(0, 0, 0, 0.45);
        background-image: linear-gradient(180deg, rgba(15, 18, 28, 0.96), rgba(9, 13, 22, 0.94));
    }
</style>
</head>
<body>

    <!-- Khung hình điện thoại -->
    <div class="phone-frame">
        
        <!-- Vùng hiển thị nội dung các trang -->
        <div id="main-content"></div>

        <!-- Thanh menu dưới cùng -->
        <div class="bottom-nav hidden">
            <div onclick="switchPage('home')" class="nav-item active" id="nav-home">
                <i class="fa-solid fa-house"></i>
                <div>首页</div>
            </div>
            <div onclick="switchPage('games')" class="nav-item" id="nav-games">
                <i class="fa-solid fa-gamepad"></i>
                <div>游戏库</div>
            </div>
            <div onclick="switchPage('cloud')" class="nav-item" id="nav-cloud">
                <i class="fa-solid fa-desktop"></i>
                <div>电脑</div>
            </div>
            <div onclick="switchPage('profile')" class="nav-item" id="nav-profile">
                <i class="fa-solid fa-user"></i>
                <div>我的</div>
            </div>
        </div>

    </div>

    <!-- Nhúng file logic -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        function detectDeviceClass() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isTouch = 'ontouchend' in document;
            const minSide = Math.min(window.screen.width, window.screen.height);
            const isTablet = minSide >= 700;
            const isGalaxyTab = /SM-T|SM-P|Galaxy Tab|SC-01C|SC-02E|SM-T5/i.test(ua);

            if (/iPad|Macintosh/i.test(ua) && isTouch) {
                return 'ipad';
            }
            if (/Android/i.test(ua) && (isGalaxyTab || isTablet)) {
                return 'tablet';
            }
            if (/Android/i.test(ua)) {
                return 'android';
            }
            if (/iPhone|iPod/i.test(ua)) {
                return 'ios';
            }
            return '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const deviceClass = detectDeviceClass();
            if (deviceClass) {
                document.body.classList.add(deviceClass);
            }
        });
    </script>
</body>
</html>
